<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body>
    <main class="container">
        <header class="hero">
            <div class="eyebrow"><span class="eyebrow-icon">✦</span> Personal finance</div>
            <h1>Expense Tracker</h1>
            <p>Keep a clear view of where your money goes.</p>
        </header>

        <section class="summary-card" aria-label="Total expenses">
            <span class="summary-label">Total expenses</span>
            <div id="total"><p><span class="currency">$</span><span id="total-amount">0.00</span></p></div>
            <span class="summary-note">Updated as you add expenses</span>
        </section>

        <section class="entry-card" aria-labelledby="add-expense-heading">
            <div class="section-heading">
                <div><span class="section-kicker">New entry</span><h2 id="add-expense-heading">Add an expense</h2></div>
                <span class="section-icon" aria-hidden="true">+</span>
            </div>
            <form id="expense-form">
                <label><span>Expense name</span><input type="text" placeholder="e.g. Groceries" id="expense-name" required /></label>
                <label><span>Amount</span><div class="amount-input"><span>$</span><input type="text" inputmode="decimal" placeholder="0.00" id="expense-amount" required /></div></label>
                <button type="submit">Add expense <span aria-hidden="true">→</span></button>
            </form>
        </section>

       
    </main>
    <script src="script.js"></script>
</body>
</html>
