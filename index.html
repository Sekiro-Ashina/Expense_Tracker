<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body>

    <div class = "container">
        <h1 class="">Expense Tracker</h1>
        <form id="expense-form">
            <input 
            type="text" 
            placeholder="Item Name" 
            id="expense-name" 
            required
            />
            <input 
            type="text" 
            placeholder="Amount" 
            id="expense-amount" 
            required
            />
            <button type="submit"> Calculate Expense </button>
        </form>

        <h2>Expenses</h2>
            <ul id="expense-list">
                <!-- Dynamically All items will be added. -->
            </ul>

        <div id="total">
            <p>Total:<span id="total-amount">$0</span></p>
        </div>
    
    </div>

    <script src="script.js"></script>

</body>
</html>
